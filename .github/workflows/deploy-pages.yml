name: Publish CampaignOS marketing (non-production)

run-name: "Marketing publish by @${{ github.actor }} — ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEMO_NON_PRODUCTION to confirm this is only a non-production public marketing surface"
        required: true
        type: string
      reason:
        description: "Auditable reason for republishing the demo"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-marketing-non-production
  cancel-in-progress: false

jobs:
  authorize-marketing-publish:
    name: Validate explicit non-production confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Reject production claims and non-main refs
        env:
          DEMO_CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          if [ "$DEMO_CONFIRMATION" != "DEMO_NON_PRODUCTION" ]; then
            echo "Refusing publish: confirmation must equal DEMO_NON_PRODUCTION." >&2
            exit 1
          fi
          if [ "$DISPATCH_REF" != "main" ]; then
            echo "Refusing publish: marketing may only be published from main." >&2
            exit 1
          fi
          echo "Authorized marketing publish. This is not dev, staging or production."

  deploy-static-marketing:
    name: Deploy static marketing (never production)
    needs: authorize-marketing-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare marketing-only Pages artifact
        run: |
          set -eu
          rm -rf .pages-site
          mkdir -p .pages-site/marketing
          cp -R web/marketing/. .pages-site/
          cp -R web/marketing/. .pages-site/marketing/
          touch .pages-site/.nojekyll
          test ! -e .pages-site/app.js
          test ! -e .pages-site/data/status.json

      - name: Upload static marketing
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./.pages-site

      - name: Deploy static marketing
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
