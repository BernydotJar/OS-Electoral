name: C3 Training one-shot repair

on:
  push:
    branches:
      - agent/c3-training-001-governed-academy
    paths:
      - .github/workflows/c3-training-one-shot-repair.yml

permissions:
  contents: write

concurrency:
  group: c3-training-one-shot-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/c3-training-001-governed-academy
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --all-groups --locked
          npm --prefix frontend ci --ignore-scripts

      - name: Apply deterministic repair
        run: python scripts/maintenance/apply_c3_training_001_repair.py

      - name: Format and verify Python repair
        run: |
          uv run ruff format \
            backend/tests/test_training_api_boundaries.py \
            backend/tests/test_training_postgres.py
          uv run ruff check \
            backend/tests/test_training_api_boundaries.py \
            backend/tests/test_training_postgres.py \
            backend/tests/test_program_state_validator.py
          uv run pytest -q \
            backend/tests/test_training_api_boundaries.py \
            backend/tests/test_training_api.py \
            backend/tests/test_program_state_validator.py

      - name: Verify frontend integration
        env:
          CAMPAIGNOS_FRONTEND_MODE: demo_read_only
          CAMPAIGNOS_FRONTEND_ENVIRONMENT: test
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run \
            src/components/training-academy-panel.test.ts \
            src/lib/training-form.test.ts \
            src/components/campaign-chapter-shell.test.ts

      - name: Remove one-shot machinery
        run: |
          rm -f .github/workflows/c3-training-one-shot-repair.yml
          rm -f scripts/maintenance/apply_c3_training_001_repair.py

      - name: Commit verified repair
        run: |
          git config user.name "CampaignOS Automation"
          git config user.email "campaignos-automation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(training): close CI and runtime integration gaps"
          git push origin HEAD:agent/c3-training-001-governed-academy
