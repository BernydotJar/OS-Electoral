name: Temporary graph reconciliation

on:
  push:
    branches:
      - agent/strategy-postmerge-reconcile-operations-activate

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Reconcile Strategy merge and activate Operations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          DATE = "2026-08-13"
          MAIN_SHA = "a2d7aa81455358eb0244b51556ffe3a192455c06"
          REVIEW_HEAD = "c49be75e6e07a1731bd780e2a5a3bcaa67ab07a8"
          BRANCH = "agent/strategy-postmerge-reconcile-operations-activate"
          OPS_BRANCH = "agent/operations-complete-ui-lifecycle"
          STRATEGY_ID = "C3-FRONT-014"
          OPS_ID = "C3-FRONT-015"
          POSTMERGE_RUN = 31768163466
          APPROVAL = {
              "recorded_at": "2026-08-13T20:50:00-06:00",
              "source": "USER_EXPLICIT_APPROVAL",
              "statement": "User explicitly directed the Graph Harness to continue product completion beyond a single feature and requested a full CampaignOS product suitable for demonstrations while preserving strict zero-cost and no-production constraints.",
              "scope": "Internal Operations and War Room UI over existing CampaignOS backend contracts, tests and review evidence only; no autonomous execution, citizen contact, targeting, persuasion, publication, spending, production deployment, Firmes implementation or paid cloud resources.",
          }
          OPS_TITLE = "Completable governed Operations and War Room lifecycle from UI"
          OPS_DEPS = [STRATEGY_ID, "C3-OPS-001", "C3-TEAM-001"]
          OPS_ACCEPTANCE = [
              "Exactly authorized operators can create and maintain the existing campaign operations roadmap only after the current Strategy is DECIDED_INTERNAL, using idempotency and optimistic concurrency.",
              "Phases, workstreams, milestones, tasks, dependencies, blockers, human decisions, follow-ups and learning notes remain bounded to existing backend contracts and Team roles without autonomous task execution.",
              "Exactly authorized operators can create a daily War Room snapshot from the current roadmap version while backend-derived readiness, blocked work and critical-path information remain authoritative.",
              "ES/EN, read-only mutation absence, mobile, keyboard, reduced motion, WCAG, PostgreSQL/API/browser and complete repository gates pass with external_effects NONE and no citizen contact, targeting, persuasion, publication, spending or mobilization.",
          ]

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, payload):
              Path(path).write_text(json.dumps(payload, indent=2, ensure_ascii=True) + "\n", encoding="utf-8")

          def by_id(items, key, value):
              return next(item for item in items if item[key] == value)

          def append_before_action(items, item):
              if any(existing.get("id") == item["id"] for existing in items):
                  return
              index = next((i for i, existing in enumerate(items) if existing.get("id") == "action:production-deployment"), len(items))
              items.insert(index, item)

          # Canonical program manifest.
          arch = load("architecture/program-state.json")
          arch["updated_at"] = DATE
          arch["source_branch"] = BRANCH
          arch["repository"]["main_sha_observed"] = MAIN_SHA
          arch["repository"]["c3_program_state"] = "C3_FRONT_014_STRATEGY_UI_MERGED_OPERATIONS_UI_ACTIVE"
          for ws in arch["workstreams"]:
              if ws["id"] == "WS-06":
                  ws["status"] = "OPERATIONS_UI_ACTIVE"
                  ws["next_increment"] = OPS_ID
              elif ws["id"] == "WS-09":
                  ws["status"] = "STRATEGY_UI_MERGED_POSTMERGE_RECONCILED"
                  ws["next_increment"] = OPS_ID
              elif ws["id"] == "WS-10":
                  ws["status"] = "OPERATIONS_UI_ACTIVE"
                  ws["next_increment"] = OPS_ID
          by_id(arch["roadmap"], "id", STRATEGY_ID)["status"] = "MERGED_TO_MAIN"
          append_before_action(arch["roadmap"], {
              "id": OPS_ID,
              "workstream": "WS-06",
              "title": OPS_TITLE,
              "status": "ACTIVE",
              "depends_on": OPS_DEPS,
              "acceptance": OPS_ACCEPTANCE,
          })
          merged_prs = arch.get("github_state", {}).get("merged_pull_requests")
          if isinstance(merged_prs, list) and 178 not in merged_prs:
              merged_prs.append(178)
              merged_prs.sort()
          save("architecture/program-state.json", arch)

          # Executable fallback state.
          fallback = load("program/program-state.json")
          fallback["updated_at"] = DATE
          fallback["branch"] = OPS_BRANCH
          fallback["current_increment"] = OPS_ID
          fallback["iteration_status"] = "IN_PROGRESS"
          fallback["ready_tasks"] = []
          for ws in fallback["workstreams"]:
              if ws["id"] == "WS-06":
                  ws["status"] = "OPERATIONS_UI_ACTIVE"
                  ws["next_increment"] = OPS_ID
              elif ws["id"] == "WS-09":
                  ws["status"] = "STRATEGY_UI_MERGED_POSTMERGE_RECONCILED"
                  ws["next_increment"] = OPS_ID
              elif ws["id"] == "WS-10":
                  ws["status"] = "OPERATIONS_UI_ACTIVE"
                  ws["next_increment"] = OPS_ID
          if not any(item.get("increment") == STRATEGY_ID for item in fallback.get("review_stack", [])):
              fallback.setdefault("review_stack", []).append({
                  "increment": STRATEGY_ID,
                  "pr": 178,
                  "branch": "agent/strategy-complete-ui-lifecycle",
                  "base": "main",
                  "state": "MERGED_TO_MAIN",
                  "delivered_head": REVIEW_HEAD,
                  "integrated_main_sha": MAIN_SHA,
              })
          save("program/program-state.json", fallback)

          # Task graph.
          graph = load("program/task-graph.yaml")
          graph["updated_at"] = DATE
          by_id(graph["tasks"], "id", STRATEGY_ID)["status"] = "MERGED_TO_MAIN"
          if not any(item.get("id") == OPS_ID for item in graph["tasks"]):
              graph["tasks"].append({
                  "id": OPS_ID,
                  "workstream": "WS-06",
                  "title": OPS_TITLE,
                  "status": "ACTIVE",
                  "depends_on": OPS_DEPS,
                  "acceptance": OPS_ACCEPTANCE,
              })
          save("program/task-graph.yaml", graph)

          # Ledger records the failed main run as historical reconciliation evidence.
          ledger = load("program/task-ledger.yaml")
          ledger["updated_at"] = DATE
          strategy = by_id(ledger["entries"], "task_id", STRATEGY_ID)
          strategy["status"] = "MERGED_TO_MAIN"
          strategy["pull_request"] = 178
          strategy["integrated_main_sha"] = MAIN_SHA
          strategy["hosted_verification"] = {
              "pull_request": 178,
              "verified_head": REVIEW_HEAD,
              "campaignos_ci_run": 31767922123,
              "campaignos_ci_number": 264,
              "campaignos_ci": "SUCCESS",
              "functional_onboarding": "SUCCESS",
              "runtime_visual_run": 31767922114,
              "runtime_visual_number": 237,
              "runtime_visual": "SUCCESS",
              "final_evidence_head": REVIEW_HEAD,
          }
          strategy["post_merge_verification"] = {
              "main_sha": MAIN_SHA,
              "campaignos_ci_run": POSTMERGE_RUN,
              "campaignos_ci_number": 265,
              "conclusion": "FAILURE_RECONCILIATION_ONLY",
              "functional_onboarding": "SUCCESS",
              "dynamic_frontend": "SUCCESS",
              "root_cause": "Graph Harness correctly rejected merged PR #178 while C3-FRONT-014 still recorded REVIEWED; no Strategy functional regression was observed.",
              "repair": "This reconciliation marks C3-FRONT-014 MERGED_TO_MAIN and activates the next product-completion node before re-running exact-head and post-merge gates.",
          }
          if not any(item.get("task_id") == OPS_ID for item in ledger["entries"]):
              ledger["entries"].append({
                  "task_id": OPS_ID,
                  "owner": "WS-06/WS-10",
                  "status": "IN_PROGRESS",
                  "evidence": [
                      f"specs/{OPS_ID}/requirements.md",
                      f"specs/{OPS_ID}/design.md",
                      f"specs/{OPS_ID}/tasks.md",
                      "program/iterations/c3-front-015.md",
                  ],
                  "external_effects": "NONE",
                  "blockers": [],
                  "approval": APPROVAL,
                  "base_main_sha": MAIN_SHA,
                  "branch": OPS_BRANCH,
              })
          save("program/task-ledger.yaml", ledger)

          # Graph Harness projection now selects Operations as the only active node.
          execution = load("program/graph-harness-execution.json")
          execution["target"]["revision"] = MAIN_SHA
          scheduler = execution["scheduler"]
          scheduler["evaluated_at"] = DATE
          scheduler["active_feature"] = OPS_ID
          scheduler["ready_nodes"] = []
          scheduler["selected_node"] = {
              "id": OPS_ID,
              "title": OPS_TITLE,
              "mode": "SHIP",
              "state": "in_progress",
              "human_approval": "APPROVED",
              "dependencies": OPS_DEPS,
              "specs": [
                  f"specs/{OPS_ID}/requirements.md",
                  f"specs/{OPS_ID}/design.md",
                  f"specs/{OPS_ID}/tasks.md",
              ],
              "selection_reason": "C3-FRONT-014 is merged and its post-merge browser journey is functionally green. Operations/War Room is now the highest-priority existing-backend journey dead end because the backend already supports governed roadmap and snapshot writes while the frontend remains read-only.",
              "approval_receipt": APPROVAL,
          }
          execution["active_increment"] = {
              "id": OPS_ID,
              "status": "IN_PROGRESS",
              "branch": OPS_BRANCH,
              "base_main_sha": MAIN_SHA,
              "production_status": "BLOCKED",
              "release_decision": "DENY_RELEASE",
              "external_effects": "NONE",
              "next_action": "IMPLEMENT_EXISTING_OPERATIONS_AND_WAR_ROOM_UI_CONTRACTS",
          }
          execution["post_merge_reconciliation"] = {
              "id": "repair:c3-front-014-postmerge-ledger-2026-08-13",
              "status": "IN_PROGRESS",
              "merged_pr": 178,
              "integrated_main_sha": MAIN_SHA,
              "failed_post_merge_run": POSTMERGE_RUN,
              "failure_class": "PROGRAM_STATE_RECONCILIATION_ONLY",
              "functional_onboarding": "SUCCESS",
              "external_effects": "NONE",
          }
          save("program/graph-harness-execution.json", execution)

          # Strategy validation/evidence become truthful about merge and the historical failed gate.
          validation_path = Path("program/validations/c3-front-014.json")
          validation = load(validation_path)
          validation["status"] = "MERGED_TO_MAIN"
          validation["integrated_main_sha"] = MAIN_SHA
          validation["pull_request"] = 178
          validation["hosted_verification"] = {
              "state": "PASS_FINAL_EXACT_HEAD",
              "pull_request": 178,
              "verified_head": REVIEW_HEAD,
              "campaignos_ci": {"run_id": 31767922123, "run_number": 264, "conclusion": "SUCCESS", "functional_onboarding": "SUCCESS"},
              "runtime_visual_review": {"run_id": 31767922114, "run_number": 237, "conclusion": "SUCCESS"},
          }
          validation["post_merge_verification"] = strategy["post_merge_verification"]
          save(validation_path, validation)

          evidence_path = Path("docs/testing/c3-front-014-evidence.md")
          evidence = evidence_path.read_text(encoding="utf-8")
          if "## Post-merge reconciliation" not in evidence:
              evidence += f'''\n\n## Post-merge reconciliation\n\nPR #178 was squash-merged to `main@{MAIN_SHA}`. CampaignOS CI #265 (`{POSTMERGE_RUN}`) preserved the full frontend/API onboarding success, including Strategy `DECIDED_INTERNAL`, but failed the locked quality suite because the live Git reconciliation test correctly detected that the merged PR was still recorded as `REVIEWED`. This is a historical program-state reconciliation failure, not a Strategy functional regression. C3-FRONT-014 is now recorded `MERGED_TO_MAIN`; production remains `BLOCKED`, release remains `DENY_RELEASE`, and external effects remain `NONE`.\n'''
          evidence_path.write_text(evidence, encoding="utf-8")

          review_path = Path("progress/review_C3-FRONT-014.md")
          review = review_path.read_text(encoding="utf-8")
          if "## Merge reconciliation" not in review:
              review += f'''\n\n## Merge reconciliation\n\nMerged through PR #178 at `main@{MAIN_SHA}`. Post-merge CampaignOS CI #265 failed only the intentional live-Git reconciliation guard because the ledger still said `REVIEWED`; the API-backed functional onboarding job itself passed. The canonical records now reconcile C3-FRONT-014 to `MERGED_TO_MAIN` and hand execution to C3-FRONT-015.\n'''
          review_path.write_text(review, encoding="utf-8")

          iteration_path = Path("program/iterations/c3-front-014.md")
          iteration = iteration_path.read_text(encoding="utf-8")
          if "Post-merge reconciliation:" not in iteration:
              iteration += f'''\n\nPost-merge reconciliation: PR #178 merged at `main@{MAIN_SHA}`. Main CI #265 failed only the expected stale-ledger reconciliation guard while the functional onboarding job passed. This repair records Strategy `MERGED_TO_MAIN` and moves the scheduler to C3-FRONT-015.\n'''
          iteration_path.write_text(iteration, encoding="utf-8")

          # Complete spec for the next existing-backend product node.
          spec_dir = Path(f"specs/{OPS_ID}")
          spec_dir.mkdir(parents=True, exist_ok=True)
          (spec_dir / "requirements.md").write_text('''# C3-FRONT-015 Requirements\n\n## Summary\n\nRemove the Operations/War Room UI dead end so an exactly authorized campaign operator can turn the internally decided Strategy into a governed execution roadmap and daily War Room snapshot using the already-merged CampaignOS backend contracts.\n\n## Product finding\n\nAfter C3-FRONT-014 the journey can reach an internal Strategy decision, but the Operations/War Room chapter remains read-only. The backend already supports roadmap create/update, phases, workstreams, milestones, dependency-aware tasks, blockers, human decisions, follow-ups, learning notes and append-only daily War Room snapshots. The highest-value next increment is therefore UI completion over existing work rather than a new domain.\n\n## Acceptance criteria\n\n- [ ] Operations authoring unlocks only after the current Strategy is `DECIDED_INTERNAL` and exact Operations grants are present.\n- [ ] Exactly authorized users can create the existing roadmap with idempotency and update it with current-version `If-Match` plus idempotency.\n- [ ] Phase, workstream, milestone, task and dependency references use existing records and preserve backend referential validation.\n- [ ] Tasks expose owner roles from the existing Team workspace and never execute automatically.\n- [ ] Blockers, human decisions, follow-up items and learning notes remain internal operating records with no external effects.\n- [ ] Backend-derived readiness, blocked work and critical path remain authoritative; the UI does not invent execution status.\n- [ ] Exactly authorized users can create the daily War Room snapshot from the current roadmap version and review the latest snapshot.\n- [ ] Read-only review renders no mutation controls and no prohibited visible review-mode wording.\n- [ ] ES/EN, mobile, keyboard, reduced motion, overflow and WCAG checks pass.\n- [ ] No voter profiling, targeting, persuasion, citizen contact, publication, spending, mobilization, autonomous execution, Firmes integration or production deployment is introduced.\n- [ ] Focused tests, PostgreSQL/API/browser lifecycle and complete repository gates pass with `external_effects=NONE`.\n\n## Non-goals\n\n- new Operations persistence schema or backend execution engine;\n- autonomous task execution or automated political decision-making;\n- voter-level targeting, persuasion, contact or mobilization;\n- Firmes integration;\n- production deployment or paid cloud services.\n''', encoding="utf-8")
          (spec_dir / "design.md").write_text('''# C3-FRONT-015 Design\n\n## Existing contracts first\n\nUse the merged `campaign_operations` API and Operations contracts without introducing a second roadmap model. Add typed frontend mutation evidence parsers and API client methods for roadmap create/update and War Room snapshot creation.\n\n## Authorization and prerequisites\n\nDerive exact Operations capabilities from server-projected grants. Same-origin routes must fail closed unless Strategy exists at `DECIDED_INTERNAL`; UI role labels never authorize writes. Preserve backend idempotency and optimistic concurrency.\n\n## Authoring model\n\nExtend the current read-only Operations workspace with progressive forms for phases, workstreams, milestones, tasks/dependencies, blockers, explicit human decisions, follow-ups and learning notes. Select Team owner roles and cross-record references from existing projections rather than accepting free-form identifiers. Preserve unrelated collections on bounded updates.\n\n## War Room\n\nExpose snapshot creation only from a current roadmap projection and exact snapshot-create authority. Render backend-computed readiness, blocked work and critical path as read models; do not infer or execute tasks client-side.\n\n## Safety\n\nAll records are internal operational artifacts. No task is executed by the application, no citizen is contacted, no political audience is targeted or scored, and no publication, spending, mobilization, grant creation, Firmes sync or production effect occurs. Read-only mode has no mutation forms.\n\n## Verification\n\nAdd parser/client/route/component adversarial tests; extend the PostgreSQL/API-backed onboarding journey from Strategy `DECIDED_INTERNAL` through roadmap persistence and a War Room snapshot; then run the complete Graph Harness lifecycle and release gates.\n''', encoding="utf-8")
          (spec_dir / "tasks.md").write_text('''# C3-FRONT-015 Tasks\n\n- [ ] Add exact Operations/War Room capability projection and local seed grants if missing.\n- [ ] Add typed roadmap create/update and snapshot-create API client evidence contracts.\n- [ ] Add bounded Operations form parsing with existing Team and roadmap reference selection.\n- [ ] Add same-origin roadmap create/update and War Room snapshot routes with prerequisite, idempotency and version protection.\n- [ ] Add progressive ES/EN Operations authoring UI without autonomous task execution.\n- [ ] Add explicit blockers, human decisions, follow-up and learning-note controls.\n- [ ] Add War Room snapshot creation gated by exact authority and current roadmap version.\n- [ ] Add focused unit/route/component/adversarial tests.\n- [ ] Extend the API-backed browser journey beyond Strategy `DECIDED_INTERNAL`.\n- [ ] Run Producer verification.\n- [ ] Run Critic / Red Team and record findings.\n- [ ] Apply Fixer repairs.\n- [ ] Run Independent Verifier gates.\n- [ ] Persist review, validation and iteration evidence.\n- [ ] Freeze the branch and verify exact-head CampaignOS CI + Runtime Visual Review.\n- [ ] Merge only after exact-head gates and require post-merge CampaignOS CI success.\n''', encoding="utf-8")

          Path("program/iterations/c3-front-015.md").write_text(f'''# C3-FRONT-015 iteration\n\n## Goal\n\nMake the existing Operations and War Room backend lifecycle completable through CampaignOS UI after Strategy reaches `DECIDED_INTERNAL`, with no autonomous execution or external political effect.\n\n## Graph selection\n\nC3-FRONT-014 is integrated at `main@{MAIN_SHA}`. The post-merge functional onboarding job is green; its only failed gate is stale Graph Harness merge reconciliation, repaired by the current branch. Operations/War Room is the highest-priority remaining existing-backend journey dead end.\n\n## Approval\n\n`USER_EXPLICIT_APPROVAL` from the ongoing product-completion instruction. Scope is internal roadmap/War Room UI over existing APIs, tests and evidence. Production, paid cloud resources, Firmes, citizen contact, targeting, persuasion, publication, spending and mobilization remain outside approval.\n\n## Lifecycle\n\n- Producer: active after reconciliation merge and post-merge green gate.\n- Critic / Red Team: pending.\n- Fixer: pending.\n- Independent Verifier: pending.\n- Release Gate: production remains `BLOCKED`; release remains `DENY_RELEASE`.\n- External effects: `NONE`.\n''', encoding="utf-8")
          PY

          python3 scripts/architecture/validate_program_state.py
          python3 scripts/release/validate_release_readiness.py

          git diff --check
          git config user.name "ChatGPT Graph Reconciler"
          git config user.email "chatgpt-graph-reconciler@example.invalid"
          git add architecture/program-state.json program/program-state.json program/task-graph.yaml program/task-ledger.yaml program/graph-harness-execution.json program/validations/c3-front-014.json docs/testing/c3-front-014-evidence.md progress/review_C3-FRONT-014.md program/iterations/c3-front-014.md specs/C3-FRONT-015 program/iterations/c3-front-015.md
          git commit -m "fix(program): reconcile strategy merge and activate operations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
