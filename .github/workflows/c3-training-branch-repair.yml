name: Temporary C3 Training workflow-run reconciliation

on:
  workflow_run:
    workflows:
      - CampaignOS CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: c3-training-workflow-run-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'agent/c3-training-001-governed-academy'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Training branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/c3-training-001-governed-academy
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile repaired Training tree with main
        run: |
          git config user.name "CampaignOS Automation"
          git config user.email "campaignos-automation@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main \
            -m "chore(training): reconcile repaired branch with main"
          rm -f .github/workflows/c3-training-branch-repair.yml
          git show origin/main:.github/workflows/c1-front-002-v1.yml \
            > .github/workflows/c1-front-002-v1.yml
          git add -A
          git commit --amend --no-edit
          git diff --check origin/main...HEAD
          git merge-base --is-ancestor origin/main HEAD
          test ! -e .github/workflows/c3-training-branch-repair.yml
          test "$(git hash-object .github/workflows/c1-front-002-v1.yml)" = \
            "$(git rev-parse origin/main:.github/workflows/c1-front-002-v1.yml)"

      - name: Push reconciled Training branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            push origin HEAD:agent/c3-training-001-governed-academy
