name: Temporary C3 Training branch repair

on:
  workflow_run:
    workflows:
      - CampaignOS CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: c3-training-branch-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'agent/c3-training-001-governed-academy'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Training branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/c3-training-001-governed-academy
          fetch-depth: 0
          persist-credentials: false

      - name: Verify guarded repair payload
        run: |
          test -f scripts/maintenance/apply_c3_training_001_repair.py
          test -f .github/workflows/c3-training-one-shot-repair.yml
          test "$(git branch --show-current)" = "agent/c3-training-001-governed-academy"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --all-groups --locked
          npm --prefix frontend ci --ignore-scripts

      - name: Apply deterministic repair
        run: python scripts/maintenance/apply_c3_training_001_repair.py

      - name: Format and verify Python repair
        run: |
          uv run ruff format \
            backend/tests/test_training_api_boundaries.py \
            backend/tests/test_training_postgres.py
          uv run ruff check \
            backend/tests/test_training_api_boundaries.py \
            backend/tests/test_training_postgres.py \
            backend/tests/test_program_state_validator.py
          uv run pytest -q \
            backend/tests/test_training_api_boundaries.py \
            backend/tests/test_training_api.py \
            backend/tests/test_program_state_validator.py

      - name: Verify frontend integration
        env:
          CAMPAIGNOS_FRONTEND_MODE: demo_read_only
          CAMPAIGNOS_FRONTEND_ENVIRONMENT: test
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run \
            src/components/training-academy-panel.test.ts \
            src/lib/training-form.test.ts \
            src/components/campaign-chapter-shell.test.ts

      - name: Remove one-shot branch machinery
        run: |
          rm -f .github/workflows/c3-training-one-shot-repair.yml
          rm -f scripts/maintenance/apply_c3_training_001_repair.py

      - name: Commit verified branch repair
        run: |
          git config user.name "CampaignOS Automation"
          git config user.email "campaignos-automation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(training): close CI and runtime integration gaps"

      - name: Push verified branch repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            push origin HEAD:agent/c3-training-001-governed-academy
